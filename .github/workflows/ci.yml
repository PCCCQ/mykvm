name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        run: rustup default stable

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

  android:
    name: Android receiver
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # The Android SDK + NDK are a few GB; the runner already carries a lot of
      # unrelated toolchains we never use here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # Must match `ndkVersion` in android/app/build.gradle.kts: the Gradle build
      # hands this NDK's clang to cargo as the cross linker.
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      # The Gradle build resolves the NDK for cargo itself and, without this,
      # would take the highest version it finds -- which on a runner image that
      # ships its own NDKs is not necessarily the one `ndkVersion` pins.
      - name: Pin the NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/rust -> target

      - name: Install Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      # Host build of the protocol core: no NDK needed, and it covers the wire
      # format and the state machine.
      - name: Test the Android protocol core
        run: cargo test --manifest-path android/rust/Cargo.toml

      # Both variants matter: the debug build is the installable one users
      # sideload, and the release build is what runs R8 over the JNI bindings --
      # a keep rule that goes missing only breaks there.
      - name: Build the APKs
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: mykvm-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
